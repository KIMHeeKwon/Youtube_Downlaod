<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube 고화질 다운로더</title>
<style>
  /* 테마 토큰 — 라이트 기본값 */
  :root {
    color-scheme: light;
    --bg: #ffffff;
    --text: #222222;
    --panel: #f5f5f5;
    --border: #dddddd;
    --bar-track: #eeeeee;
    --bar-fill: #4caf50;
    --accent: #cc0000;
    --accent-text: #ffffff;
    --disabled: #999999;
    --error: #cc0000;
    --done: #2e7d32;
  }
  /* 시스템 다크 테마 추종 (수동 선택이 없을 때) */
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #1b1b1b;
      --text: #e8e6e3;
      --panel: #2a2a2a;
      --border: #444444;
      --bar-track: #3a3a3a;
      --bar-fill: #66bb6a;
      --accent: #d64545;
      --accent-text: #ffffff;
      --disabled: #666666;
      --error: #ef7070;
      --done: #81c784;
    }
  }
  /* 수동 선택은 시스템 설정보다 우선 */
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff;
    --text: #222222;
    --panel: #f5f5f5;
    --border: #dddddd;
    --bar-track: #eeeeee;
    --bar-fill: #4caf50;
    --accent: #cc0000;
    --accent-text: #ffffff;
    --disabled: #999999;
    --error: #cc0000;
    --done: #2e7d32;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1b1b1b;
    --text: #e8e6e3;
    --panel: #2a2a2a;
    --border: #444444;
    --bar-track: #3a3a3a;
    --bar-fill: #66bb6a;
    --accent: #d64545;
    --accent-text: #ffffff;
    --disabled: #666666;
    --error: #ef7070;
    --done: #81c784;
  }

  body { font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
         max-width: 900px; margin: 2rem auto; padding: 0 1rem;
         color: var(--text); background: var(--bg); }
  header { display: flex; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.4rem; }
  #theme-btn { background: var(--panel); color: var(--text);
               border: 1px solid var(--border); border-radius: 4px;
               padding: .35rem .7rem; cursor: pointer; font-size: .85rem; }
  form { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center;
         padding: 1rem; background: var(--panel); border-radius: 8px; }
  input[type=url] { flex: 1 1 320px; padding: .5rem; }
  input[type=text] { width: 90px; padding: .5rem; }
  select, button { padding: .5rem; }
  form button { background: var(--accent); color: var(--accent-text);
                border: 0; border-radius: 4px; cursor: pointer; }
  form button:disabled { background: var(--disabled); }
  table { width: 100%; border-collapse: collapse; margin-top: 1.5rem; }
  th, td { border-bottom: 1px solid var(--border); padding: .5rem; text-align: left; font-size: .9rem; }
  .bar { background: var(--bar-track); border-radius: 4px; overflow: hidden; width: 140px; height: 16px; }
  .bar > div { background: var(--bar-fill); height: 100%; }
  .pct { font-size: .75rem; margin-left: .3rem; }
  .st-error { color: var(--error); } .st-done { color: var(--done); }
  #msg { color: var(--error); margin-top: .5rem; min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>YouTube 고화질 다운로더</h1>
  <button type="button" id="theme-btn" title="테마 전환"></button>
</header>
<form id="form">
  <input type="url" id="url" placeholder="YouTube 영상 또는 재생목록 URL" required>
  <select id="max_height" title="최대 해상도">
    <option value="">해상도 무제한</option>
    <option value="2160">2160p</option>
    <option value="1080">1080p</option>
    <option value="720">720p</option>
  </select>
  <select id="codec" title="코덱">
    <option value="best">best</option>
    <option value="compat">compat</option>
  </select>
  <input type="text" id="subs" placeholder="자막 (ko,en)">
  <button type="submit" id="btn">다운로드</button>
</form>
<div id="msg"></div>
<table>
  <thead>
    <tr><th>제목</th><th>상태</th><th>진행률</th><th>속도</th><th>세부</th></tr>
  </thead>
  <tbody id="jobs"></tbody>
</table>
<script>
const STATUS_KO = { queued: "대기", downloading: "다운로드 중", merging: "병합 중",
                    done: "완료", error: "오류" };

/* 테마 전환 — 수동 선택은 localStorage에 저장, 없으면 시스템 설정 추종 */
const themeBtn = document.getElementById("theme-btn");
const savedTheme = localStorage.getItem("theme");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;

function currentTheme() {
  return document.documentElement.dataset.theme ||
    (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function updateThemeBtn() {
  themeBtn.textContent = currentTheme() === "dark" ? "☀️ 라이트" : "🌙 다크";
}
themeBtn.addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  localStorage.setItem("theme", next);
  updateThemeBtn();
});
updateThemeBtn();

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn");
  const msg = document.getElementById("msg");
  btn.disabled = true; msg.textContent = "";
  const body = { url: document.getElementById("url").value };
  const h = document.getElementById("max_height").value;
  if (h) body.max_height = parseInt(h, 10);
  body.codec = document.getElementById("codec").value;
  const subs = document.getElementById("subs").value.trim();
  if (subs) body.subs = subs;
  try {
    const res = await fetch("/api/downloads", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      msg.textContent = err.detail || `요청 실패 (${res.status})`;
    } else {
      document.getElementById("url").value = "";
    }
  } catch {
    msg.textContent = "서버에 연결할 수 없습니다.";
  } finally {
    btn.disabled = false;
  }
});

function esc(s) {
  return String(s).replace(/[&<>"]/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function poll() {
  try {
    const jobs = await (await fetch("/api/downloads")).json();
    document.getElementById("jobs").innerHTML = jobs.map(j => `
      <tr>
        <td>${esc(j.title || j.url)}</td>
        <td class="st-${esc(j.status)}">${STATUS_KO[j.status] || esc(j.status)}</td>
        <td><span style="display:flex;align-items:center">
          <span class="bar"><div style="width:${Number(j.percent) || 0}%"></div></span>
          <span class="pct">${(Number(j.percent) || 0).toFixed(1)}%</span>
        </span></td>
        <td>${esc(j.speed || "")}</td>
        <td>${esc(j.detail || "")}</td>
      </tr>`).join("");
  } catch { /* 서버 미응답 시 다음 폴링에서 재시도 */ }
}
setInterval(poll, 1000);
poll();
</script>
</body>
</html>
