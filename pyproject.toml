[project]
name = "youtube-download"
version = "0.1.0"
description = "YouTube 고화질 다운로더 — 데스크톱 GUI · 웹 UI · CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.2",
    "uvicorn>=0.51.0",
    "yt-dlp>=2026.7.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
